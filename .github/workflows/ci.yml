name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development tools
        run: python -m pip install -e ".[dev,web,remote]"
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Check annotations, docstrings, and lint
        run: ruff check src tests scripts
      - name: Check generated frontend protocol
        run: python scripts/generate_protocol.py --check
      - name: Run backend tests
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/uarm-wheel .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check TypeScript
        run: npm run check
      - name: Build production frontend
        run: npm run build
