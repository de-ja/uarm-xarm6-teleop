[serial]
device = "/dev/ttyACM0"
baudrate = 1000000
ids = [1, 2, 3, 4, 5, 6, 7]

[leader]
midpoint = 2047
gripper_zero_position = 2457
gripper_pressed_position = 2757
directions = [1, 1, 1, 1, 1, 1, 1]
labels = ["base", "shoulder", "J3", "J4", "J5", "wrist", "trigger"]

[xarm6]
reference_degrees = [0.0, -75.0, 9.0, 0.0, 0.0, 0.0]
joint_directions = [-1, -1, -1, -1, 1, -1]
# Measured servo-7 travel from raw 2457 (open) to 2757 (fully pressed).
gripper_travel_degrees = 26.3671875
gripper_command_max = 0.81
# Toggle mode is retained in code but temporarily disabled.
gripper_mode = "proportional"
# These thresholds are used only when gripper_mode = "toggle".
gripper_press_degrees = 10.0
gripper_release_degrees = 4.0

[simulation]
scene = "Empty-v1"
rate = 30.0

[wireless]
# Shared tolerance policy for the leader link and the operator console link.
# A leader sample slower than leader_timeout is retried rather than fatal, up to
# leader_max_consecutive_timeouts in a row. Worst-case blind time is
# leader_timeout x (leader_max_consecutive_timeouts + 1) and must stay below
# physical_xarm.watchdog_timeout, which validation enforces.
leader_timeout = 0.15
leader_max_consecutive_timeouts = 4
# Seconds to wait for a telemetry browser to reconnect before stopping motion.
# Set to 0 to stop the moment the last console disconnects.
browser_grace_seconds = 2.0

[physical_xarm]
# Leave blank in source control; pass --robot-ip or use a local override file.
robot_ip = ""
rate = 20.0
mode = 6
joint_speed_degrees = 20.0
joint_acceleration_degrees = 100.0
startup_tolerance_degrees = 5.0
leader_start_tolerance_degrees = 10.0
max_target_jump_degrees = 10.0
# After a tolerated link gap the follower slews toward the leader at this rate
# per control cycle instead of faulting on the jump limit. A divergence beyond
# catchup_max_divergence_degrees is too far to chase safely and still faults.
catchup_step_degrees = 3.0
catchup_max_divergence_degrees = 45.0
# Widened from 0.25 s so a tolerated wireless gap cannot trip the robot-local
# guard. Must stay above the wireless blind time; validation enforces that.
watchdog_timeout = 1.0
joint_lower_degrees = [-360.0, -118.0, -217.7, -360.0, -97.0, -360.0]
joint_upper_degrees = [360.0, 120.0, 11.0, 360.0, 180.0, 360.0]
# Which UFACTORY gripper is attached: "g2" or "classic". The families use
# different units and are not interchangeable, so the wrong value here is
# rejected by configuration validation rather than sent to the hardware.
#   g2      opening width in mm (0-84), speed in mm/s (15-225), force 1-100
#   classic encoder pulses (0-850), speed in r/min, and no force argument
# The classic gripper caps no force in its controller, so keep gripper_max_step
# small: the contact latch is then the sole over-grip guard and needs several
# 20 Hz cycles to react before meaningful force builds.
gripper_kind = "g2"
gripper_open_position = 84
gripper_closed_position = 0
gripper_speed = 50
gripper_force = 20
gripper_max_step = 2
