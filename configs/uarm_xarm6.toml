[serial]
device = "/dev/ttyACM0"
baudrate = 1000000
ids = [1, 2, 3, 4, 5, 6, 7]

[leader]
midpoint = 2047
gripper_zero_position = 2457
gripper_pressed_position = 2757
directions = [1, 1, 1, 1, 1, 1, 1]
labels = ["base", "shoulder", "J3", "J4", "J5", "wrist", "trigger"]

[xarm6]
reference_degrees = [0.0, -75.0, 9.0, 0.0, 70.0, 0.0]
joint_directions = [-1, -1, -1, -1, 1, -1]
# Measured servo-7 travel from raw 2457 (open) to 2757 (fully pressed).
gripper_travel_degrees = 26.3671875
gripper_command_max = 0.81
# Toggle mode is retained in code but temporarily disabled.
gripper_mode = "proportional"
# These thresholds are used only when gripper_mode = "toggle".
gripper_press_degrees = 10.0
gripper_release_degrees = 4.0

[simulation]
scene = "Empty-v1"
rate = 30.0

[physical_xarm]
# Leave blank in source control; pass --robot-ip or use a local override file.
robot_ip = ""
rate = 20.0
mode = 6
joint_speed_degrees = 20.0
joint_acceleration_degrees = 100.0
startup_tolerance_degrees = 5.0
leader_start_tolerance_degrees = 10.0
max_target_jump_degrees = 10.0
watchdog_timeout = 0.25
joint_lower_degrees = [-360.0, -118.0, -217.7, -360.0, -97.0, -360.0]
joint_upper_degrees = [360.0, 120.0, 11.0, 360.0, 180.0, 360.0]
# xArm Gripper G2: position is opening width in mm; force range is 1-100.
gripper_open_position = 84
gripper_closed_position = 0
gripper_speed = 50
gripper_force = 20
gripper_max_step = 2
