[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uarm-xarm6-teleop"
version = "0.2.0"
description = "Use a Feetech U-ARM as a leader for simulated and physical xArm6 followers."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "feetech-servo-sdk>=1.0.0,<2",
    "numpy>=1.26,<3",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
sim = [
    "gymnasium>=0.29,<1.1",
    "mani-skill>=3.0.0b21,<4",
]
physical = [
    "xarm-python-sdk>=1.15,<2",
]
web = [
    "fastapi>=0.115,<1",
    "opencv-python>=4.10,<5.1",
    "uvicorn[standard]>=0.34,<1",
]
remote = [
    "websockets>=15,<17",
]
tactile = [
    "anyskin>=1,<2",
]
dev = [
    # starlette.testclient needs httpx, which the WebSocket tests use. It is
    # present locally only as a transitive dependency, so CI installs nothing
    # without this and the socket tests fail there alone.
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
uarm-monitor = "uarm_xarm6_teleop.cli.monitor:main"
uarm-ports = "uarm_xarm6_teleop.cli.ports:main"
uarm-leader = "uarm_xarm6_teleop.cli.leader:main"
uarm-real = "uarm_xarm6_teleop.cli.real:main"
uarm-sim = "uarm_xarm6_teleop.cli.sim:main"
uarm-station = "uarm_xarm6_teleop.cli.station:main"
uarm-tune-reference = "uarm_xarm6_teleop.cli.tune_reference:main"
uarm-web = "uarm_xarm6_teleop.cli.web:main"

[tool.setuptools.package-data]
uarm_xarm6_teleop = ["web/dist/**/*"]

[tool.setuptools.packages.find]
# eflesh is a self-contained sensor package at the repository root rather than
# under src/, so both roots are scanned and filtered to the two real packages.
where = ["src", "."]
include = ["uarm_xarm6_teleop*", "eflesh*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "D", "E4", "E7", "E9", "F"]
ignore = [
    "ANN401", # External SDK and WebSocket boundaries expose dynamic objects.
    "D105", # Class docstrings document standard context-manager methods.
    "D107", # Class docstrings document constructor arguments and invariants.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
